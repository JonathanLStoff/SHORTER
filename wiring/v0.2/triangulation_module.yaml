metadata:
  title: Indoor Triangulation Module (x3 identical units)
  description: >
    One of three identical indoor triangulation modules.
    Each unit contains an ESP32-C3 and a CC1101 915 MHz RF
    transceiver, powered from a 5 V USB supply. The three
    units are placed at known positions indoors and used
    to triangulate the mower bot.

connectors:
  ESP32C3:
    type: ESP32-C3 Dev Board
    pins:
      - 5V
      - 3V3
      - GND1
      - GND2
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7
      - GPIO8
      - GPIO9
  CC1101:
    type: CC1101 915 MHz RF Transceiver
    pins: [VCC, GND, SI, SO, SCLK, CSN, GDO0, GDO2]
  USB:
    type: USB-C 5V Power Input
    pins: [5V, GND]

cables:
  W_PWR:
    gauge: 26 AWG
    length: 0.15
    colors: [RD, BK]
  W_SPI:
    gauge: 26 AWG
    length: 0.15
    colors: [RD, BK, BU, GN, YE, OG, VT, GY]

connections:
  # --- 5 V power ---
  - [USB: 5V,  W_PWR: 1, ESP32C3: 5V]
  - [USB: GND, W_PWR: 2, ESP32C3: GND1]

  # --- CC1101 SPI link ---
  - [ESP32C3: 3V3,   W_SPI: 1, CC1101: VCC]
  - [ESP32C3: GND2,  W_SPI: 2, CC1101: GND]
  - [ESP32C3: GPIO4, W_SPI: 3, CC1101: SI]
  - [ESP32C3: GPIO5, W_SPI: 4, CC1101: SO]
  - [ESP32C3: GPIO6, W_SPI: 5, CC1101: SCLK]
  - [ESP32C3: GPIO7, W_SPI: 6, CC1101: CSN]
  - [ESP32C3: GPIO8, W_SPI: 7, CC1101: GDO0]
  - [ESP32C3: GPIO9, W_SPI: 8, CC1101: GDO2]